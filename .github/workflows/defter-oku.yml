name: defter-oku
on:
  push:
    branches: [gecici/defter-oku]
permissions:
  contents: write
jobs:
  oku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sS https://api.npoint.io/7e5bcb28b0d4471ca91a -o defter.json
          python3 -c "import json;d=json.load(open('defter.json'));print(len(d['matches']))"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add defter.json
          git commit -m "defter anlık görüntü"
          git push
