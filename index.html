const depo = {
    async get(k, s = true) {
        if (!s) {
            const v = localStorage.getItem(k);
            return v === null ? null : { key: k, value: v, shared: false };
        }
        const r = await fetch(SB_URL + "/rest/v1/kupon_veri?select=deger&anahtar=eq." + encodeURIComponent(k), { headers: SB_BASLIK });
        if (!r.ok)
            throw new Error("okuma hatasi " + r.status);
        const d = await r.json();
        return d.length ? { key: k, value: d[0].deger, shared: true } : null;
    },
    async set(k, v, s = true) {
        if (!s) {
            localStorage.setItem(k, v);
            return { key: k, value: v, shared: false };
        }
        const r = await fetch(SB_URL + "/rest/v1/kupon_veri", {
            method: "POST",
            headers: Object.assign({}, SB_BASLIK, { Prefer: "resolution=merge-duplicates,return=minimal" }),
            body: JSON.stringify({ anahtar: k, deger: v, guncelleme: new Date().toISOString() }),
        });
        if (!r.ok)
            throw new Error("yazma hatasi " + r.status);
        return { key: k, value: v, shared: true };
    },
    async list(p, s = true) {
        if (!s)
            return { keys: Object.keys(localStorage).filter(x => x.startsWith(p)), shared: false };
        const r = await fetch(SB_URL + "/rest/v1/kupon_veri?select=anahtar&anahtar=like." + encodeURIComponent(p + "*"), { headers: SB_BASLIK });
        if (!r.ok)
            throw new Error("liste hatasi " + r.status);
        const d = await r.json();
        return { keys: d.map(x => x.anahtar), shared: true };
    },
};

async function pinKarma(lig, kisi, pin) {
    const metin = "kupon|" + lig + "|" + kisi + "|" + pin;
    try {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(metin));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    catch (e) {
        let h = 5381;
        for (let i = 0; i < metin.length; i++)

    }

.pf-kusak i{flex:1;height:1px;background:#1E2B41;font-style:normal;}
.pf-kusak em{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5F6B85;font-style:normal;}

.pf-satir{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:12px 13px;margin-bottom:7px;border-radius:12px;background:#111826;
  border:1px solid #243149;transition:border-color .12s,background .12s;
  -webkit-tap-highlight-color:transparent;}
.pf-satir.secili{background:rgba(16,185,129,.16);border-color:#10B981;}
.pf-satir.kapali{opacity:.4;}
.pf-satir:not(.kapali){cursor:pointer;}
.pf-kod{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#8A94AD;}
.pf-satir.secili .pf-kod{color:#34D399;}
.pf-ad{font-size:14.5px;font-weight:500;color:#EDF1F7;}
.pf-alt{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5F6B85;margin-top:3px;}
.pf-sebep{font-family:'JetBrains Mono',monospace;font-size:10px;color:#F0564A;margin-top:3px;}
.pf-fiyat{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right;}
.pf-fiyat.t1{font-size:19px;color:#F0D375;}
.pf-fiyat.t2{font-size:17px;color:#D8DEE9;}
.pf-fiyat.t3{font-size:15px;color:#93A0B8;}
.pf-fiyat.t4{font-size:14px;color:#66748E;}
.pf-b4{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:#F5A524;
  border:1px solid rgba(245,165,36,.5);border-radius:4px;padding:2px 5px;margin-left:7px;
  vertical-align:middle;letter-spacing:.06em;}

/* Giriş ekranı görseli */
.kp-giris-gorsel{position:relative;margin:20px 0 22px;border-radius:16px;overflow:hidden;
  border:1px solid #243149;background:#0A0F18;}
.kp-giris-gorsel img{display:block;width:100%;height:auto;}
.kp-giris-gorsel:after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(to bottom,transparent,rgba(7,11,18,.92));pointer-events:none;}

/* Hafta satırı: tamamı dokunulabilir */
.kp-haftabas{padding:12px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .14s;}
.kp-haftabas:active{background:rgba(52,211,153,.08);}

/* Hafta satırını açan düğme */
.kp-ac{width:30px;height:30px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.34);
  color:#34D399;font-size:15px;line-height:1;
  transition:transform .18s,background .18s;transform:rotate(-90deg);}
.kp-ac.acik{transform:rotate(0deg);background:rgba(52,211,153,.24);}

/* Sezon sonu büyük ödülü */
.kp-odul{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;
  border:1px solid #4A3D14;min-height:190px;display:flex;align-items:flex-end;
  background:#0A0F18;}
.kp-odul-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 62%;}
/* Metnin okunması için alttan yukarı koyulaşan perde */
.kp-odul:after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(6,9,15,.96) 0%,rgba(6,9,15,.86) 32%,rgba(6,9,15,.34) 62%,rgba(6,9,15,.12) 100%);}
.kp-odul-ic{position:relative;z-index:2;padding:16px;width:100%;}
.kp-odul-bas{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  color:#E3C15A;font-weight:700;margin-bottom:4px;}
.kp-odul-mal{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;
  color:#F0D375;letter-spacing:-.01em;line-height:1.1;
  text-shadow:0 2px 12px rgba(0,0,0,.75);}
.kp-odul-hedef{font-size:13px;font-weight:600;color:#8A94AD;letter-spacing:0;}
.kp-odul-yildiz{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;
  color:#E3C15A;letter-spacing:.02em;}
.kp-odul-dip{font-size:10px;color:#7A8299;margin-top:3px;font-style:italic;}
.kp-odul-ad{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#FFFFFF;}
.kp-odul-alt{font-size:11.5px;color:#B9C3D6;margin-top:5px;line-height:1.5;}
.kp-odul-cizgi{height:1px;background:rgba(227,193,90,.24);margin:11px 0 10px;}

/* fixed yerine sticky: .kp-ust'teki backdrop-filter, Safari'de fixed öğelerin
   konum referansını bozup çubuğu sekme geçişlerinde sayfa ortasına kaydırıyordu.
   sticky, normal akışın sonunda kalarak bu referans sorununu tamamen ortadan kaldırır. */
.kp-govde{flex:1 0 auto;}
.kp-alt{position:sticky;bottom:0;left:0;right:0;margin-top:auto;
  background:rgba(8,12,20,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid #2A3852;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -6px 20px rgba(0,0,0,.45);
  flex-shrink:0;}
.kp-alt button{background:none;border:none;color:#C8D2E4;padding:11px 2px;border-radius:11px;
  font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer;transition:background .14s,color .14s;}
.kp-alt button:active{transform:scale(.97);}
.kp-alt button.on{color:#04140D;background:var(--aksan);box-shadow:0 2px 10px rgba(52,211,153,.35);}
.kp :focus-visible{outline:2px solid var(--aksan);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){.kp *{transition:none!important;}}
