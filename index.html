<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#EFF2EC">
<meta name="description" content="Hakem kararları düzeltilseydi Süper Lig puan tablosu ne olurdu?">
<meta property="og:title" content="Düdük Payı">
<meta property="og:description" content="Hakem kararları düzeltilseydi Süper Lig puan tablosu ne olurdu?">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Düdük Payı">
<title>Düdük Payı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1210'/%3E%3Crect y='10' width='32' height='3' fill='%23126B45'/%3E%3Crect y='19' width='32' height='3' fill='%23126B45'/%3E%3Crect x='4' y='13' width='15' height='6' rx='2' fill='%23E8B62C'/%3E%3Ccircle cx='20.5' cy='16' r='6' fill='%23E8B62C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --ground:#EFF2EC; --panel:#FFFFFF; --panel2:#F6F8F2;
  --edge:#D6DDD0; --edge2:#E6EBE0; --line:#D6DDD0;
  --ink:#111813; --body:#39463C; --muted:#5E6D61; --dim:#7C8A7F;
  --amber:#8A6206; --amberFill:#E8B62C; --red:#A32F26; --redFill:#DB6A5E;
  --green:#126B45; --greenFill:#35B77C;
  --shadow:0 1px 2px rgba(17,24,19,.05), 0 6px 18px rgba(17,24,19,.06);
}
*{box-sizing:border-box;}

html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--ground);color:var(--body);
  font-family:'Karla',system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;}
body{background-image:radial-gradient(ellipse 80% 36% at 50% -8%,color-mix(in srgb,var(--greenFill) 10%,transparent),transparent 70%),repeating-linear-gradient(90deg,transparent 0 56px,color-mix(in srgb,var(--green) 6%,transparent) 56px 57px);background-attachment:fixed;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1;}
.lockup{display:flex;align-items:center;gap:14px;}
.mark{flex:0 0 auto;display:block;border-radius:8px;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 16%,transparent);}
.pitch-svg{position:absolute;right:-6px;top:10px;width:132px;height:88px;color:var(--green);opacity:.14;pointer-events:none;}
.season{font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:6px 0 0;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;}
.kpi{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:12px;box-shadow:var(--shadow);}
.kpi b{display:block;font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;}
.kpi span{display:block;margin-top:5px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.legend{display:flex;flex-wrap:wrap;gap:14px 18px;margin:0 0 14px;font-size:12.5px;color:var(--muted);}
.legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;vertical-align:1px;}
.legend .lg{background:var(--greenFill);} .legend .lr{background:var(--redFill);}
.tdot{display:inline-grid;grid-template-columns:1fr 1fr;width:12px;height:12px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);}
.tdot i{display:block;}
.team{display:flex;align-items:center;gap:8px;min-width:0;}
.tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.rank{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--dim);justify-self:end;}
.rank.r1{background:var(--amberFill);color:#1a1400;}
.rank.r2{background:color-mix(in srgb,var(--ink) 14%,var(--panel));color:var(--ink);}
.rank.r3{background:color-mix(in srgb,var(--amberFill) 38%,var(--panel));color:var(--ink);}
.foot{margin-top:28px;padding:18px 0 8px;border-top:1px solid var(--edge);color:var(--muted);font-size:12.5px;line-height:1.55;}
.foot b{color:var(--ink);}
h1{font-size:40px;}
@media(max-width:400px){h1{font-size:30px;} .mark{width:44px;height:44px;} .kpi b{font-size:18px;}}

/* Başlık */
.head{padding:30px 0 18px;position:relative;}
.head:before{content:"";position:absolute;left:-16px;right:-16px;top:0;height:150px;pointer-events:none;z-index:-1;
  background:
    linear-gradient(180deg,rgba(53,183,124,.09),transparent 72%),
    repeating-linear-gradient(90deg,rgba(53,183,124,.05) 0 34px,transparent 34px 68px);}
h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:46px;line-height:.98;
  letter-spacing:.005em;text-transform:uppercase;margin:0;color:var(--ink);}
h1 span{color:var(--amberFill);}
.sub{color:var(--body);font-size:15px;margin:10px 0 0;line-height:1.55;max-width:34ch;}
.who{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:15px;
  border-top:1px solid var(--edge);font-size:14px;color:var(--muted);flex-wrap:wrap;}
.who b{font-weight:600;color:var(--ink);}
.who button:not(.temabtn){background:none;border:0;color:var(--amber);font-size:14px;cursor:pointer;
  padding:2px 0;font-family:inherit;font-weight:500;border-bottom:1px solid currentColor;}
.who button:not(.temabtn):focus-visible{outline:2px solid var(--amber);outline-offset:3px;}

/* Sekmeler */
.tabwrap{position:relative;margin:6px 0 20px;}
.tabs{display:flex;gap:3px;background:var(--panel);
  border:1px solid var(--edge);border-radius:10px;padding:4px;box-shadow:var(--shadow);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;}
.tabs::-webkit-scrollbar{display:none;}
/* Kenarlardaki solma: kaydırılacak yer olduğunu gösterir */
.tabwrap:before,.tabwrap:after{content:"";position:absolute;top:1px;bottom:1px;width:36px;
  pointer-events:none;opacity:0;transition:opacity .18s;z-index:2;border-radius:10px;}
.tabwrap:before{left:1px;background:linear-gradient(90deg,var(--panel) 30%,transparent);}
.tabwrap:after{right:1px;background:linear-gradient(270deg,var(--panel) 30%,transparent);}
.tabwrap.sol:before{opacity:1;}
.tabwrap.sag:after{opacity:1;}
/* Ok işareti */
.tabok{position:absolute;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none;
  font-size:15px;line-height:1;color:var(--amber);opacity:0;transition:opacity .18s;}
.tabok.l{left:6px;} .tabok.r{right:6px;}
.tabwrap.sol .tabok.l{opacity:.9;}
.tabwrap.sag .tabok.r{opacity:.9;}
.tab{flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;
  font-family:'Oswald',sans-serif;font-weight:500;font-size:14.5px;letter-spacing:.03em;
  padding:11px 13px;border-radius:7px;white-space:nowrap;transition:color .14s,background .14s;}
.tab.on{background:var(--ink);color:var(--ground);font-weight:600;}
.tab:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}

.misafir{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
  background:var(--amberFill);color:#1a1400;font-size:11.5px;font-weight:600;letter-spacing:.02em;}
.misafir:before{content:"";width:6px;height:6px;border-radius:50%;background:#1a1400;opacity:.55;}

/* Sıralama seçici */
.siraSec{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.siraSec button{background:var(--panel2);border:1px solid var(--edge);color:var(--muted);
  padding:9px 6px;border-radius:9px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.siraSec button.on{background:var(--amberFill);border-color:var(--amber);color:#1a1400;}
.ozet-ik i.ana{color:var(--amber);font-weight:600;}
.ozet-ik i.sol{color:var(--dim);}

/* Etki özeti */
.ozet-bas{font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
.ozet-sat{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--edge2);}
.ozet-sat:last-of-type{border-bottom:none;}
.ozet-kafa{padding:4px 0;border-bottom:1px solid var(--edge);}
.ozet-kafa .ozet-ad,.ozet-kafa i{font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-style:normal;}
.ozet-no{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);text-align:center;}
.ozet-ad{font-size:14px;color:var(--ink);min-width:0;}
.ozet-alt{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.ozet-alt b{color:var(--body);font-weight:600;}
.ozet-puan{font-family:'DM Mono',monospace;font-size:16px;color:var(--amber);white-space:nowrap;}
.ozet-ik{display:grid;grid-template-columns:56px 56px;gap:4px;text-align:right;}
.ozet-ik i{font-family:'DM Mono',monospace;font-size:14px;font-style:normal;}
.ozet-ik i.art{color:var(--red);}
.ozet-ik i.eksi{color:var(--green);}

/* En etkili kararlar */
.ekar{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--edge2);}
.ekar:last-of-type{border-bottom:none;}
.esira{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);text-align:center;}
.egovde{min-width:0;}
.ebas{font-size:14px;color:var(--ink);font-weight:600;}
.emeta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.emag{font-size:12px;color:var(--body);margin-top:3px;}
.edeger{font-family:'DM Mono',monospace;font-size:16px;color:var(--green);white-space:nowrap;}

/* Hafta klasörleri */
.hafta{border:1px solid var(--edge);border-radius:12px;margin-bottom:10px;overflow:hidden;
  background:var(--panel2);}
.hafta-bas{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;}
.hafta-bas:active{background:var(--edge2);}
.hafta-ok{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;flex:0 0 auto;border-radius:50%;font-size:13px;line-height:1;
  background:var(--amberFill);color:#1a1400;transform:rotate(-90deg);transition:transform .18s;}
.hafta-ok.acik{transform:rotate(0deg);}
.hafta-ad{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink);flex:1;}
.hafta-sayi{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap;}
.hafta-sayi b{color:var(--amber);font-weight:500;}
.hafta-ic{padding:0 10px 10px;}

/* Takım detayı */
.trow-t{cursor:pointer;}
.trow-t:hover .team{color:var(--amber);}
.trow-t.acik{background:var(--panel2);}
.trow-t:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}
.detay{background:var(--panel2);border-left:2px solid var(--amberFill);
  border-radius:0 8px 8px 0;padding:10px 12px;margin:2px 0 10px;}
.dsatir{padding:8px 0;border-bottom:1px solid var(--edge2);}
.dsatir:last-child{border-bottom:none;}
.dust{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--ink);}
.dskor{font-family:'DM Mono',monospace;font-weight:500;color:var(--muted);margin-left:4px;}
.dup{font-family:'DM Mono',monospace;font-size:14px;color:var(--green);}
.ddown{font-family:'DM Mono',monospace;font-size:14px;color:var(--red);}
.dmeta{font-size:12px;color:var(--muted);margin-top:3px;}
.dkarar{font-size:12.5px;color:var(--body);margin-top:5px;padding-left:2px;display:flex;align-items:center;gap:7px;}
.dnokta{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}

/* Kartlar */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;
  padding:20px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--amberFill),transparent 62%);opacity:.5;}
.lbl{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink);margin-bottom:14px;display:block;}

/* Form */
label{font-size:13px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px;}
input,select{width:100%;background:var(--panel);border:1.5px solid var(--edge);color:var(--ink);
  padding:12px;border-radius:9px;font-size:16px;font-family:'Karla',sans-serif;line-height:1.3;}
input::placeholder{color:var(--dim);}
input:focus,select:focus{outline:none;border-color:var(--ink);}
.row{display:flex;gap:10px;} .row>*{flex:1;min-width:0;}
button.btn{background:var(--ink);color:var(--ground);border:0;padding:13px 18px;border-radius:10px;
  font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;letter-spacing:.045em;text-transform:uppercase;
  cursor:pointer;line-height:1.2;transition:filter .14s,transform .1s;}
button.btn:hover{filter:brightness(1.1);}
button.btn:active{transform:translateY(1px);}
button.btn:disabled{opacity:.32;}
button.ghost{background:var(--panel);color:var(--body);border:1.5px solid var(--edge);}
button.danger{background:none;color:var(--red);border:1.5px solid color-mix(in srgb,var(--red) 38%,transparent);}
button.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;}

/* Tablolar */
.thead,.trow{display:grid;grid-template-columns:26px 1fr 50px 94px 56px;gap:8px;align-items:center;}
.thead{padding-bottom:10px;border-bottom:1.5px solid var(--edge);
  font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);}
.trow{padding:11px 0;border-bottom:1px solid var(--edge2);}
.trow:last-of-type{border-bottom:0;}
.pos{font-family:'DM Mono',monospace;font-size:13px;color:var(--dim);text-align:right;}
.team{font-size:15px;font-weight:500;color:var(--ink);}
.pts{font-family:'DM Mono',monospace;font-size:14.5px;text-align:right;color:var(--ink);font-weight:500;}
.ctr{text-align:center;}
.drift{position:relative;height:18px;}
.axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--edge);}
.bar{position:absolute;top:5px;height:9px;border-radius:3px;
  transition:width .45s cubic-bezier(.2,.7,.3,1),left .45s cubic-bezier(.2,.7,.3,1);}
.bar.pos{background:var(--greenFill);} .bar.neg{background:var(--redFill);}
.band{position:absolute;top:2px;height:15px;border:1px dashed rgba(143,80,0,.35);border-radius:3px;}
.delta{font-family:'DM Mono',monospace;font-size:13px;text-align:right;font-weight:500;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}
.mv{font-size:11px;color:var(--amber);margin-left:3px;}

/* Maç kartları */
.match{border-left:3px solid var(--edge);padding:12px 0 14px 14px;margin-bottom:14px;}
.match:last-of-type{margin-bottom:0;}
.match.has{border-left-color:var(--amberFill);}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.mteams{font-size:16px;font-weight:600;color:var(--ink);}
.mscore{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--amber);}
.mmeta{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.dec{font-size:13.5px;color:var(--body);margin-top:9px;padding-left:12px;
  border-left:2px solid var(--edge2);line-height:1.55;}
.chip{display:inline-block;font-family:'DM Mono',monospace;font-size:11.5px;padding:2px 6px;
  border:1px solid var(--edge);border-radius:5px;color:var(--muted);margin-left:6px;}
.by{display:inline-block;font-size:12px;background:var(--panel2);border:1px solid var(--edge);
  border-radius:5px;padding:2px 8px;color:var(--muted);margin-left:7px;font-weight:500;}

/* Yardımcı */
.empty{text-align:center;padding:40px 18px;color:var(--muted);font-size:15px;line-height:1.65;}
.note{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:14px;}
.warn{background:#FDEDEB;border:1px solid #F0C9C4;color:#8A2B22;
  padding:13px 15px;border-radius:10px;font-size:14px;line-height:1.55;margin-bottom:14px;}
.ok{background:#E8F6F0;border:1px solid #B3DFCE;color:#0A5B43;
  padding:13px 15px;border-radius:10px;font-size:14px;margin-bottom:14px;}
.cand{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:15px;
  margin-bottom:12px;font-size:14px;line-height:1.6;}
.cand strong{color:var(--ink);}
input[type=range]{accent-color:var(--amber);padding:0;background:none;border:0;height:28px;}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--edge);
  border-radius:8px;padding:7px 12px;font-size:14px;margin:0 7px 8px 0;color:var(--ink);}
details{margin-top:14px;border-top:1px solid var(--edge2);padding-top:12px;}
summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--amber);}
summary:focus-visible{outline:2px solid var(--amber);outline-offset:3px;}
details .note{margin-top:10px;}

/* Giriş */
.gate{max-width:400px;margin:0 auto;padding:70px 20px;}
.gate h1{font-size:46px;margin-bottom:14px;}
.gate .lead{color:var(--body);font-size:16px;line-height:1.6;margin:0 0 28px;}
.gate .who-btn{display:block;width:100%;margin-bottom:10px;background:var(--panel);
  border:1.5px solid var(--edge);border-radius:11px;padding:17px;font-size:17px;font-weight:500;
  color:var(--ink);cursor:pointer;font-family:'Karla',sans-serif;text-align:left;
  box-shadow:var(--shadow);}
.gate .who-btn:hover{border-color:var(--ink);}
.gate .who-btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px;}
.gate .foot{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:26px;}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.qbtn{background:var(--panel);border:1.5px solid var(--edge);border-radius:10px;padding:14px 10px;
  font-family:'Karla',sans-serif;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;
  line-height:1.35;text-align:center;min-height:56px;}
.qbtn:hover{border-color:var(--ink);}
.qbtn.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
.qbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.qstep{font-size:13.5px;font-weight:600;color:var(--ink);margin:0 0 9px;}
.qpanel{background:var(--panel2);border:1.5px solid var(--amberFill);border-radius:11px;padding:15px;margin-top:10px;}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.qchip{background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--body);}
.qmin{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.qelle{display:flex;gap:7px;align-items:stretch;}
.qelle input{flex:1;min-width:0;}
.qelle .btn{flex:0 0 auto;padding:0 16px;}
.qmin .qbtn{padding:11px 2px;min-height:44px;font-family:'DM Mono',monospace;font-size:13px;}
@media (max-width:400px){
  h1{font-size:36px;} .tab{font-size:13px;padding:11px 2px;}
  .card{padding:16px;} .thead,.trow{grid-template-columns:22px 1fr 44px 78px 50px;gap:6px;}
}
@media (prefers-reduced-motion:reduce){.bar{transition:none;}}
/* Koyu tema. İki yolla açılır:
   1) kullanıcı elle seçmişse  html[data-tema="koyu"]
   2) hiç seçmemişse ve sistemi koyuysa  html:not([data-tema]) */
@media (prefers-color-scheme:dark){
  html:not([data-tema]){
    --ground:#0B1210; --panel:#141D19; --panel2:#1B2721;
    --edge:#2C3B33; --edge2:#243129; --line:#2C3B33;
    --ink:#EDF2EA; --body:#C3D0C6; --muted:#94A499; --dim:#6E8076;
    --amber:#F2C230; --amberFill:#E8B62C; --red:#F0685A; --redFill:#DB5A4C;

<script>
/* ---------------- Ekip ---------------- */
var CREW=["Güven","Ferhat","Musa","Gökhanlort","Coşkun"];

/* ---------------- Model ---------------- */
var XG_PEN=0.76, XG_GOAL=1.0, RED_BASE=0.9;
var TYPES=[
 {id:"pen_not",  label:"Verilmeyen penaltı",            side:"self", val:function(){return XG_PEN;}},
 {id:"goal_off", label:"Haksız iptal edilen gol",       side:"self", val:function(){return XG_GOAL;}},
 {id:"pen_opp",  label:"Rakibe yanlış verilen penaltı", side:"opp",  val:function(){return -XG_GOAL;}},
 {id:"goal_opp", label:"Rakibin geçersiz golü sayıldı", side:"opp",  val:function(){return -XG_GOAL;}},
 {id:"red_self", label:"Mağdur takıma haksız kırmızı",  side:"self", val:function(m){return RED_BASE*Math.max(0,(90-m)/90);}},
 {id:"red_opp",  label:"Rakibe gösterilmeyen kırmızı",  side:"self", val:function(m){return RED_BASE*Math.max(0,(90-m)/90);}}
];
function typeOf(id){for(var i=0;i<TYPES.length;i++){if(TYPES[i].id===id)return TYPES[i];}return TYPES[0];}

var DEFAULT_TEAMS=["Alanyaspor","Amedspor","Başakşehir","Beşiktaş","Çorum FK","Erzurumspor FK","Eyüpspor","Fenerbahçe","Galatasaray","Gaziantep FK","Gençlerbirliği","Göztepe","Kasımpaşa","Kocaelispor","Konyaspor","Rizespor","Samsunspor","Trabzonspor"];
var TEAM_COLORS={"Alanyaspor":["#F47920","#1D4F8C"],"Amedspor":["#C8102E","#1B7A3D"],"Başakşehir":["#F47B20","#1A1A1A"],"Beşiktaş":["#111813","#E8ECE6"],"Çorum FK":["#C8102E","#111813"],"Erzurumspor FK":["#0033A0","#E8ECE6"],"Eyüpspor":["#5B1A4A","#C9A227"],"Fenerbahçe":["#002F6C","#E8B62C"],"Galatasaray":["#A90432","#E8B62C"],"Gaziantep FK":["#C8102E","#111813"],"Gençlerbirliği":["#C8102E","#111813"],"Göztepe":["#C8102E","#E8B62C"],"Kasımpaşa":["#003DA5","#E8ECE6"],"Kocaelispor":["#126B45","#111813"],"Konyaspor":["#126B45","#E8ECE6"],"Rizespor":["#003DA5","#C8102E"],"Samsunspor":["#C8102E","#E8ECE6"],"Trabzonspor":["#7B1113","#3B5998"]};
function tdot(name){var c=TEAM_COLORS[name]||["#7c8a7f","#5e6d61"];return '<span class="tdot" aria-hidden="true"><i style="background:'+c[0]+'"></i><i style="background:'+c[1]+'"></i></span>';}

function sm(id,week,home,hg,ag,away,ref){return {id:id,week:String(week),home:home,away:away,hg:hg,ag:ag,ref:ref,by:"TFF",skorOnay:true,decisions:[]};}
var SEED_MATCHES=[
sm(101,1,"Galatasaray",2,2,"Çorum FK","Batuhan Kolak"),sm(102,1,"Gençlerbirliği",2,1,"Fenerbahçe","Oğuzhan Aksu"),sm(103,1,"Kasımpaşa",1,1,"Trabzonspor","Gürcan Hasova"),sm(104,1,"Gaziantep FK",1,1,"Alanyaspor","Yasin Kol"),sm(105,1,"Başakşehir",2,0,"Kocaelispor","Mehmet Türkmen"),sm(106,1,"Beşiktaş",1,0,"Eyüpspor","Oğuzhan Çakır"),sm(107,1,"Amedspor",3,0,"Erzurumspor FK","Halil Umut Meler"),sm(108,1,"Samsunspor",3,3,"Göztepe","Kadir Sağlam"),sm(109,1,"Konyaspor",0,1,"Rizespor","Cihan Aydın"),
sm(201,2,"Alanyaspor",1,0,"Beşiktaş","Adnan Deniz Kayatepe"),sm(202,2,"Çorum FK",0,1,"Kasımpaşa","Fatih Tokail"),sm(203,2,"Fenerbahçe",4,2,"Konyaspor","Atilla Karaoğlan"),sm(204,2,"Eyüpspor",0,1,"Gaziantep FK","Reşat Onur Coşkunses"),sm(205,2,"Trabzonspor",2,1,"Başakşehir","Ali Şansalan"),sm(206,2,"Göztepe",0,1,"Gençlerbirliği","Batuhan Kolak"),sm(207,2,"Kocaelispor",2,0,"Amedspor","Ümit Öztürk"),sm(208,2,"Rizespor",0,2,"Samsunspor","Ömer Faruk Turtay"),sm(209,2,"Erzurumspor FK",0,4,"Galatasaray","Çağdaş Altay"),
sm(301,3,"Gençlerbirliği",1,1,"Erzurumspor FK","Ümit Öztürk"),sm(302,3,"Gaziantep FK",1,2,"Rizespor","Batuhan Kolak"),sm(303,3,"Eyüpspor",2,1,"Alanyaspor","Cihan Aydın"),sm(304,3,"Galatasaray",3,2,"Göztepe","Mehmet Türkmen"),sm(305,3,"Samsunspor",0,2,"Fenerbahçe","Yasin Kol"),sm(306,3,"Başakşehir",1,1,"Kasımpaşa","Halil Umut Meler"),sm(307,3,"Amedspor",2,1,"Trabzonspor","Atilla Karaoğlan"),sm(308,3,"Beşiktaş",6,2,"Çorum FK","Çağdaş Altay"),sm(309,3,"Konyaspor",1,2,"Kocaelispor","Gürcan Hasova"),
sm(401,4,"Başakşehir",2,3,"Galatasaray","Kadir Sağlam"),sm(402,4,"Fenerbahçe",1,2,"Beşiktaş","Halil Umut Meler"),sm(403,4,"Erzurumspor FK",1,0,"Konyaspor","Yasin Kol"),sm(404,4,"Çorum FK",3,0,"Eyüpspor","Davut Dakul Çelik"),sm(405,4,"Kasımpaşa",2,2,"Amedspor","Oğuzhan Çakır"),sm(406,4,"Trabzonspor",5,0,"Gençlerbirliği","Çağdaş Altay"),sm(407,4,"Kocaelispor",1,0,"Samsunspor","Reşat Onur Coşkunses")
];
function seedKopya(){return SEED_MATCHES.map(function(m){return {id:m.id,week:m.week,home:m.home,away:m.away,hg:m.hg,ag:m.ag,ref:m.ref,by:m.by,skorOnay:true,decisions:[]};});}

function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function pois(k,l){return Math.exp(-l)*Math.pow(l,k)/fact(k);}
function xPts(lh,la){
  /* Kesme (12 gol) yüzünden kaybolan olasılık kütlesi tek tarafa yığılmasın:
     galibiyet, beraberlik ve mağlubiyet ayrı sayılıp toplam 1'e normalize edilir. */
  var w=0,d=0,l=0;
  for(var h=0;h<=12;h++)for(var a=0;a<=12;a++){
    var p=pois(h,lh)*pois(a,la);
    if(h>a)w+=p; else if(h===a)d+=p; else l+=p;
  }
  var t=w+d+l; if(t<=0) return {home:1,away:1};
  w/=t; d/=t; l/=t;
  return {home:3*w+d, away:3*l+d};
}
function realPts(hg,ag){return hg>ag?[3,0]:(hg<ag?[0,3]:[1,1]);}
function matchImpact(m){
  var list=m.decisions||[];
  var RED=["red_self","red_opp"];
  var scoreDecs=[], redDecs=[];
  list.forEach(function(d){ (RED.indexOf(d.type)>=0?redDecs:scoreDecs).push(d); });

  /* Bir kararın gerçekleşme olasılığı:
     verilmeyen penaltı -> gol olma ihtimali de çarpılır (0.76)
     verilen penaltı / gol -> sonuç zaten bilindiği için tam 1 */
  function prob(d,w){ return d.type==="pen_not" ? w*XG_PEN : w; }
  /* Mağdur tarafa +1 mi, faydalanan taraftan -1 mi */
  function goalShift(d){
    var toHome = (d.harmed==="home");
    if(d.type==="pen_not"||d.type==="goal_off") return toHome?[1,0]:[0,1];
    return toHome?[0,-1]:[-1,0];   /* rakibin haksız golü/penaltısı silinir */
  }

  function calc(mode){
    function wOf(d){
      if(mode==="low") return d.certainty>=75 ? d.certainty/100 : 0;
      if(mode==="high") return 1;
      return d.certainty/100;
    }
    /* --- Kırmızı kartlar: kalan süreye yayılan gol beklentisi --- */
    var rh=0, ra=0;
    redDecs.forEach(function(d){
      var v=RED_BASE*Math.max(0,(90-d.minute)/90)*wOf(d);
      if(d.harmed==="home") rh+=v; else ra+=v;
    });

    /* --- A) Olasılıksal (maç yeniden oynanır) --- */
    var ph=0, pa=0;
    scoreDecs.forEach(function(d){
      var g=goalShift(d), p=prob(d,wOf(d));
      ph+=g[0]*p; pa+=g[1]*p;
    });
    var poi=xPts(Math.max(0.02,m.hg+ph+rh), Math.max(0.02,m.ag+pa+ra));

    /* --- B) Kesikli (skor düzeltilir, maç yeniden oynanmaz) ---
       Tüm karar kombinasyonları taranır: n karar için 2^n senaryo.
       12'yi aşarsa tarama pratik olmaktan çıkar; o durumda kesikli dal
       yerine olasılıksal sonuç kullanılır (tek maçta 12+ karar zaten yok). */
    var n=scoreDecs.length, eh=0, ea=0;
    if(n>12){ eh=poi.home; ea=poi.away; }
    else
    for(var mask=0; mask<(1<<n); mask++){
      var pr=1, gh=m.hg, ga=m.ag;
      for(var i=0;i<n;i++){
        var d=scoreDecs[i], p=prob(d,wOf(d));
        if(mask&(1<<i)){ pr*=p; var g=goalShift(d); gh+=g[0]; ga+=g[1]; }
        else pr*=(1-p);
      }
      if(pr<=0) continue;
      gh=Math.max(0,gh); ga=Math.max(0,ga);
      var pts;
      if(rh||ra) pts=xPts(Math.max(0.02,gh+rh), Math.max(0.02,ga+ra));
      else { var r=realPts(gh,ga); pts={home:r[0],away:r[1]}; }
      eh+=pr*pts.home; ea+=pr*pts.away;
    }

    /* --- Harmanlama: olay ne kadar geç olduysa kesikli senaryo o kadar ağır --- */
    var t=0; list.forEach(function(d){ t=Math.max(t,Math.min(90,d.minute||45)); });
    var wDisc = list.length ? t/90 : 0;
    /* Karşılaştırma noktası da aynı mantıkla harmanlanmalı:
       kesikli tarafta gerçek skorun gerçek puanı, olasılıksal tarafta beklenen puan */
    var poiBase=xPts(Math.max(0.02,m.hg),Math.max(0.02,m.ag));
    /* Kesikli dalda kırmızı kart varsa maç yine oynatılıyor demektir;
       o zaman taban da beklenen puan olmalı, gerçek puan değil. */
    var rb=realPts(m.hg,m.ag);
    var dbh = (rh||ra) ? poiBase.home : rb[0];
    var dba = (rh||ra) ? poiBase.away : rb[1];
    var bh = wDisc*dbh + (1-wDisc)*poiBase.home;
    var ba = wDisc*dba + (1-wDisc)*poiBase.away;
    var fh = wDisc*eh + (1-wDisc)*poi.home;
    var fa = wDisc*ea + (1-wDisc)*poi.away;
    return {home:fh-bh, away:fa-ba};
  }
  /* Bir maçtan alınabilecek puan 0-3 arasındadır. Model bu aralığın dışına
     taşarsa taşan kısım puana yazılmaz; "boşa giden mağduriyet" olarak ayrı
     kaydedilir: takım maçı zaten kazanmıştır, ama aleyhine hata yapılmıştır. */
  function kirp(im){
    var r=realPts(m.hg,m.ag);
    function tek(ham, gercek){
      var duz=gercek+ham;
      var kirpik=Math.max(0,Math.min(3,duz));
      var tasan=duz-kirpik;
      /* tasan>0: hak ettiği 3'ü aşıyor, puana dönüşemeyen mağduriyet
         tasan<0: hak ettiği 0'ın altında, düşürülemeyen avantaj */
      return {etki:kirpik-gercek, bosa:Math.max(0,tasan), fazla:Math.max(0,-tasan)};
    }
    var h=tek(im.home,r[0]), a=tek(im.away,r[1]);
    return {home:h.etki, away:a.etki,
            bosaHome:h.bosa, bosaAway:a.bosa,
            fazlaHome:h.fazla, fazlaAway:a.fazla};
  }
  return {mid:kirp(calc("mid")), low:kirp(calc("low")), high:kirp(calc("high"))};
}

function buildTable(){
  var t={};
  S.teams.forEach(function(n){t[n]={name:n,p:0,gf:0,ga:0,pts:0,mid:0,low:0,high:0,forC:0,agC:0,bosa:0,fazla:0};});
  S.matches.forEach(function(m){
    if(!t[m.home]||!t[m.away])return;
    var r=realPts(m.hg,m.ag),H=t[m.home],A=t[m.away];
    H.p++;A.p++;H.gf+=m.hg;H.ga+=m.ag;A.gf+=m.ag;A.ga+=m.hg;H.pts+=r[0];A.pts+=r[1];
    var im=matchImpact(m);
    H.mid+=im.mid.home;A.mid+=im.mid.away;
    H.bosa+=im.mid.bosaHome;A.bosa+=im.mid.bosaAway;
    H.fazla+=im.mid.fazlaHome;A.fazla+=im.mid.fazlaAway;
    H.low+=im.low.home;A.low+=im.low.away;
    H.high+=im.high.home;A.high+=im.high.away;
    (m.decisions||[]).forEach(function(d){
      var harmed=d.harmed==="home"?H:A, other=d.harmed==="home"?A:H;
      harmed.agC++; other.forC++;
    });
  });
  var arr=Object.keys(t).map(function(k){return t[k];});
  var real=arr.slice().sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
  real.forEach(function(x,i){x.realPos=i+1;});
  var adj=arr.slice().sort(function(a,b){return (b.pts+b.mid)-(a.pts+a.mid)||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;});
  adj.forEach(function(x,i){x.adjPos=i+1;});
  return {real:real,adj:adj};
}

/* ---------------- Durum ---------------- */
var S={tema:null, me:null, teams:DEFAULT_TEAMS.slice(), matches:[], tab:"table", draft:null, editId:null, acikTakim:null,
       cands:null, busy:false, msg:"", wkNum:"", wkBusy:false, wkList:null, binId:"", sync:"yerel", quick:null,
       cekHaftaNo:"", cekBusy:false, cekMsg:"", cekHata:false, hakemSira:"hata"};
/* Misafir kipi: adres ?misafir ile bitiyorsa uygulama salt okunur açılır.
   Kimlik sorulmaz, yazma yolları kapanır, düzenleme sekmeleri gizlenir. */
var MISAFIR = /(^|[?&#])misafir(=|&|$)/.test(location.search + location.hash);
var MISAFIR_BIN = "7e5bcb28b0d4471ca91a";

var TABS=MISAFIR
 ?[["table","Tablo"],["big4","Dört Büyük"],["matches","Maçlar"],["refs","Hakemler"],["method","Kurallar"]]
 :[["table","Tablo"],["big4","Dört Büyük"],["add","Maç ekle"],["matches","Maçlar"],
          ["refs","Hakemler"],["teams","Ayarlar"],["method","Kurallar"]];
var KEY="dudukpayi-html-v1";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* --- Yerel katman: localStorage (Netlify) + window.storage (Claude önizleme) --- */
function lsGet(k){try{return window.localStorage?localStorage.getItem(k):null;}catch(e){return null;}}
function lsSet(k,v){try{if(window.localStorage)localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{if(window.localStorage)localStorage.removeItem(k);}catch(e){}}
/* Ortak defter elle düzenlenebildiği için dışarıdan gelen veri güvenilmezdir.
   Skorlar, dakika ve kesinlik makul aralığa çekilir; bozuk kayıt elenir. */
function tamSayi(v,alt,ust,varsayilan){
  var n=parseInt(v,10);
  if(!isFinite(n)) n=varsayilan;
  return Math.max(alt,Math.min(ust,n));
}
function macTemizle(liste){
  if(!Array.isArray(liste)) return [];
  var gecerliTip={};
  TYPES.forEach(function(t){ gecerliTip[t.id]=1; });
  return liste.filter(function(m){ return m && typeof m==="object" && m.home && m.away && m.home!==m.away; })
   .map(function(m){
     var kararlar=Array.isArray(m.decisions)?m.decisions:[];
     return {
       id: m.id||Date.now()+Math.floor(Math.random()*1000),
       home: String(m.home), away: String(m.away),
       hg: tamSayi(m.hg,0,99,0), ag: tamSayi(m.ag,0,99,0),
       ref: m.ref==null?"":String(m.ref),
       week: m.week==null?"":String(m.week),
       by: m.by==null?"":String(m.by),
       skorOnay: !!m.skorOnay,
       decisions: kararlar.filter(function(d){ return d && gecerliTip[d.type]; })
        .map(function(d){
          return { type:d.type,
                   harmed: d.harmed==="away"?"away":"home",
                   minute: tamSayi(d.minute,0,120,45),
                   certainty: tamSayi(d.certainty,0,100,80),
                   note: d.note==null?"":String(d.note) };
        })
     };
   });
}

function applyDoc(d){
  if(d&&Array.isArray(d.teams)&&d.teams.length)S.teams=d.teams;
  if(d&&Array.isArray(d.matches))S.matches=macTemizle(d.matches);
}
function localSave(){
  if(MISAFIR) return;
  var doc=JSON.stringify({teams:S.teams,matches:S.matches});
  lsSet(KEY,doc);
  try{ if(window.storage&&window.storage.set) window.storage.set(KEY,doc,true); }catch(e){}
}
function localLoad(cb){
  var raw=lsGet(KEY);
  if(raw){ try{applyDoc(JSON.parse(raw));}catch(e){} }
  /* Örnek veri yalnızca hiçbir ortak deftere bağlı değilken gösterilir.
     Aksi halde geçici bir senkron hatasında bu veri gerçek sezonun üstüne yazılabilirdi. */
  if((!S.matches||!S.matches.length) && !binUrl()) S.matches=seedKopya();
  try{
    if(window.storage&&window.storage.get){
      window.storage.get(KEY,true).then(function(r){
        if(r&&r.value){try{applyDoc(JSON.parse(r.value));}catch(e){}}
        cb();
      }).catch(cb); return;
    }
  }catch(e){}
  cb();
}

/* --- Ortak depo: npoint.io --- */
function binUrl(){ return S.binId?("https://api.npoint.io/"+S.binId):null; }
function remotePush(cb){
  if(MISAFIR){ if(cb)cb(true); return; }
  if(!binUrl()){ if(cb)cb(true); return; }
  fetch(binUrl(),{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({teams:S.teams,matches:S.matches})})
  .then(function(r){ if(cb)cb(r.ok); })
  .catch(function(){ if(cb)cb(false); });
}
function remotePull(cb){
  if(!binUrl()){ if(cb)cb(false); return; }
  fetch(binUrl()).then(function(r){return r.ok?r.json():null;})
  .then(function(d){ if(d){applyDoc(d); localSave();} if(cb)cb(!!d); })
  .catch(function(){ if(cb)cb(false); });
}

function save(){
  if(MISAFIR) return;
  localSave();
  if(binUrl()){
    S.sync="…";
    remotePush(function(ok){
      S.sync=ok?"ortak":"hata";
      if(!ok)S.msg="Ortak depoya yazılamadı — veri bu cihazda duruyor. İnterneti kontrol edip tekrar kaydet.";
      render();
    });
  }
}
function boot(){
  S.tema=temaOku();
  temaUygula();
  S.me=lsGet("dp-me")||null;
  S.binId=MISAFIR?MISAFIR_BIN:(lsGet("dp-bin")||"");
  try{
    if(window.storage&&window.storage.get){
      window.storage.get("dp-me",false).then(function(r){
        if(r&&r.value)S.me=r.value;
        afterMe();
      }).catch(afterMe); return;
    }
  }catch(e){}
  afterMe();
  function afterMe(){
    if(S.me&&CREW.indexOf(S.me)<0)S.me=null;
    localLoad(function(){
      if(binUrl()){ S.sync="…"; render(); remotePull(function(ok){ S.sync=ok?"ortak":"hata"; render(); }); }
      else { S.sync="yerel"; render(); }
    });
  }
}
function setMe(n){
  if(MISAFIR) return;
  S.me=n; lsSet("dp-me",n);
  try{ if(window.storage&&window.storage.set) window.storage.set("dp-me",n,false); }catch(e){}
  render();
}
function refresh(){
  S.msg="";
  if(!binUrl()){ S.msg="Ortak depo bağlı değil — Maçlar sekmesinden bağlayabilirsin."; render(); return; }
  S.sync="…"; render();
  remotePull(function(ok){ S.sync=ok?"ortak":"hata"; if(!ok)S.msg="Ortak depoya ulaşılamadı."; render(); });
}
function connectBin(){
  if(MISAFIR) return;
  var el=document.getElementById("binIn"); var v=(el.value||"").trim();
  v=v.replace(/^https?:\/\/(www\.)?(api\.)?npoint\.io\//,"").replace(/\/$/,"");
  if(!v){ S.msg="Depo kodunu yapıştır."; render(); return; }
  S.msg=""; S.sync="…"; render();
  fetch("https://api.npoint.io/"+v).then(function(r){return r.ok?r.json():Promise.reject();})
  .then(function(d){
    S.binId=v; lsSet("dp-bin",v);
    var remoteHas=d&&Array.isArray(d.matches)&&d.matches.length;
    if(remoteHas){ applyDoc(d); localSave(); S.sync="ortak"; S.msg="Bağlandı — ortak defterdeki "+d.matches.length+" maç yüklendi."; render(); }
    else { remotePush(function(ok){ S.sync=ok?"ortak":"hata"; S.msg=ok?"Bağlandı — bu cihazdaki veri ortak depoya yazıldı.":"Bağlandı ama yazılamadı."; render(); }); }
  })
  .catch(function(){ S.sync=binUrl()?"hata":"yerel"; S.msg="Depo bulunamadı. Kodu kontrol et — npoint.io adresindeki son bölüm."; render(); });
}
function disconnectBin(){
  if(MISAFIR) return;
  if(!confirm("Ortak depo bağlantısı kesilsin mi? Veri bu cihazda kalır."))return;
  S.binId=""; lsSet("dp-bin",""); S.sync="yerel"; render();
}

function vBig4(){
  var T={}; BIG4.forEach(function(n){
    T[n]={name:n, derbyF:0, derbyA:0, derbyPts:0, restF:0, restA:0, restPts:0, g:0, dg:0};
  });
  var grid={}; BIG4.forEach(function(a){ grid[a]={}; BIG4.forEach(function(b){ grid[a][b]={f:0,a:0}; }); });
  var refs={}, anyMatch=0;

  S.matches.forEach(function(m){
    var hB=BIG4.indexOf(m.home)>=0, aB=BIG4.indexOf(m.away)>=0;
    if(!hB&&!aB) return;
    anyMatch++;
    var derby=hB&&aB, im=matchImpact(m);
    if(hB){ T[m.home].g++; if(derby)T[m.home].dg++;
      if(derby)T[m.home].derbyPts+=im.mid.home; else T[m.home].restPts+=im.mid.home; }
    if(aB){ T[m.away].g++; if(derby)T[m.away].dg++;
      if(derby)T[m.away].derbyPts+=im.mid.away; else T[m.away].restPts+=im.mid.away; }
    (m.decisions||[]).forEach(function(d){
      var harmed=d.harmed==="home"?m.home:m.away, other=d.harmed==="home"?m.away:m.home;
      if(BIG4.indexOf(harmed)>=0){ if(derby)T[harmed].derbyA++; else T[harmed].restA++; }
      if(BIG4.indexOf(other)>=0){ if(derby)T[other].derbyF++; else T[other].restF++; }
      if(derby){ grid[other][harmed].f++; grid[harmed][other].a++; }
      var rn=(m.ref||"").trim();
      if(rn){
        if(!refs[rn])refs[rn]={n:rn,g:0,rows:{}};
        BIG4.forEach(function(b){ if(!refs[rn].rows[b])refs[rn].rows[b]={f:0,a:0}; });
        if(BIG4.indexOf(harmed)>=0)refs[rn].rows[harmed].a++;
        if(BIG4.indexOf(other)>=0)refs[rn].rows[other].f++;
      }
    });
    var rn2=(m.ref||"").trim();
    if(rn2){ if(!refs[rn2])refs[rn2]={n:rn2,g:0,rows:{}}; refs[rn2].g++; }
  });

  if(!anyMatch) return '<div class="card"><div class="empty">Dört büyüklerin maçı henüz girilmemiş.<br>Maç eklendikçe bu sayfa dolar.</div></div>';

  var rows=BIG4.map(function(n){var t=T[n]; t.net=t.derbyPts+t.restPts; t.totF=t.derbyF+t.restF; t.totA=t.derbyA+t.restA; return t;})
    .sort(function(a,b){return b.net-a.net;});
  var mx=1; rows.forEach(function(r){mx=Math.max(mx,Math.abs(r.net));});

  var h='<div class="card"><span class="lbl">Düdük payı — dört büyük</span>'
   +'<div class="thead" style="grid-template-columns:minmax(0,1fr) 38px 40px 68px 52px">'
   +'<div>Takım</div><div class="pts">Leh</div><div class="pts">Aleyh</div><div class="ctr">Net</div><div class="pts">Puan</div></div>';
  rows.forEach(function(r){
    var w=Math.abs(r.net)/mx*50;
    h+='<div class="trow" style="grid-template-columns:minmax(0,1fr) 38px 40px 68px 52px">'
     +'<div class="team">'+esc(r.name)+'</div>'
     +'<div class="pts" style="color:var(--green)">'+r.totF+'</div>'
     +'<div class="pts" style="color:var(--red)">'+r.totA+'</div>'
     +'<div class="drift"><div class="axis"></div>'
     +'<div class="bar '+(r.net>=0?"pos":"neg")+'" style="left:'+(r.net>=0?50:50-w)+'%;width:'+w+'%"></div></div>'
     +'<div class="delta '+(r.net>=0?"up":"down")+'">'+(r.net>=0?"+":"")+r.net.toFixed(1)+'</div></div>';
  });
  h+='</div>';

  h+='<div class="card"><span class="lbl">Derbi içi / derbi dışı</span>'
   +'<div class="thead" style="grid-template-columns:minmax(0,1.1fr) 1fr 1fr"><div>Takım</div><div class="pts">Derbi</div><div class="pts">Diğer 14</div></div>';
  rows.forEach(function(r){
    h+='<div class="trow" style="grid-template-columns:minmax(0,1.1fr) 1fr 1fr"><div class="team">'+esc(r.name)+'</div>'
     +'<div class="delta '+(r.derbyPts>=0?"up":"down")+'">'+(r.derbyPts>=0?"+":"")+r.derbyPts.toFixed(1)
     +' <span style="color:var(--dim)">('+r.dg+' maç)</span></div>'
     +'<div class="delta '+(r.restPts>=0?"up":"down")+'">'+(r.restPts>=0?"+":"")+r.restPts.toFixed(1)
     +' <span style="color:var(--dim)">('+(r.g-r.dg)+' maç)</span></div></div>';
  });
  h+='</div>';

  var anyDerby=0; BIG4.forEach(function(a){BIG4.forEach(function(b){anyDerby+=grid[a][b].f;});});
  if(anyDerby){
    h+='<div class="card"><span class="lbl">Derbilerde kim kimden</span>';
    BIG4.forEach(function(a){
      var line=BIG4.filter(function(b){return b!==a&&(grid[a][b].f||grid[a][b].a);});
      if(!line.length)return;
      h+='<div style="margin-bottom:14px"><div class="mteams" style="margin-bottom:6px">'+esc(a)+'</div>';
      line.forEach(function(b){
        h+='<div class="trow" style="grid-template-columns:1fr 54px 54px;padding:7px 0">'
         +'<div class="team" style="font-weight:400;color:var(--body)">'+esc(b)+' maçlarında</div>'
         +'<div class="pts" style="color:var(--green)">+'+grid[a][b].f+'</div>'
         +'<div class="pts" style="color:var(--red)">-'+grid[a][b].a+'</div></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }

  var rl=Object.keys(refs).map(function(k){return refs[k];})
    .filter(function(r){var t=0;BIG4.forEach(function(b){t+=r.rows[b]?r.rows[b].f+r.rows[b].a:0;});r.tot=t;return t>0;})
    .sort(function(a,b){return b.tot-a.tot;});
  if(rl.length){
    h+='<div class="card"><span class="lbl">Hakem × dört büyük</span>';
    rl.forEach(function(r){
      h+='<div style="margin-bottom:14px"><div class="mtop" style="margin-bottom:6px">'
       +'<span class="mteams">'+esc(r.n)+'</span><span class="mmeta">'+r.g+' maç</span></div>';
      BIG4.forEach(function(b){
        var v=r.rows[b]; if(!v||(!v.f&&!v.a))return;
        h+='<div class="trow" style="grid-template-columns:1fr 54px 54px;padding:7px 0">'
         +'<div class="team" style="font-weight:400;color:var(--body)">'+esc(b)+'</div>'
         +'<div class="pts" style="color:var(--green)">'+v.f+'</div>'
         +'<div class="pts" style="color:var(--red)">'+v.a+'</div></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }

  return h;
}

/* Tek bir kararın gerçek katkısı: o karar olmasaydı maç ne olurdu?
   Kararı listeden çıkarıp maçı yeniden hesaplar, farkı alır.
   Kararlar birbiriyle etkileştiği için bu "çıkarınca ne değişir" ölçüsüdür;
   tek tek katkıların toplamı maçın toplam etkisine birebir eşit olmayabilir. */
function kararEtkisi(m, i){
  var hepsi=(m.decisions||[]);
  var tam=matchImpact(m);
  var eksik=matchImpact({home:m.home,away:m.away,hg:m.hg,ag:m.ag,
    decisions:hepsi.filter(function(_,k){return k!==i;})});
  var r=realPts(m.hg,m.ag);
  function kirpik(im,taraf){
    var ham=(taraf==="home"?im.mid.home:im.mid.away);
    var gercek=(taraf==="home"?r[0]:r[1]);
    return Math.max(0,Math.min(3,gercek+ham));
  }
  return { home: kirpik(tam,"home")-kirpik(eksik,"home"),
           away: kirpik(tam,"away")-kirpik(eksik,"away") };
}

/* Sezonun skora en çok etki eden kararları */
function enEtkiliKararlar(limit){
  var liste=[];
  S.matches.forEach(function(m){
    (m.decisions||[]).forEach(function(d,i){
      var e=kararEtkisi(m,i);
      /* Bir karar puanı iki taraf arasında kaydırır; ölçü toplam etkilenen puandır */
      var buyuk=Math.abs(e.home)+Math.abs(e.away);
      if(buyuk<0.005) return;
      var magdur=(d.harmed==="home")?m.home:m.away;
      liste.push({ mac:m, karar:d, magdur:magdur,
        rakip:(d.harmed==="home")?m.away:m.home,
        deger:buyuk, magdurKazanc:(d.harmed==="home")?e.home:e.away });
    });
  });
  liste.sort(function(a,b){return b.deger-a.deger;});
  return limit?liste.slice(0,limit):liste;
}

  return h;

function takimAc(ad){ S.acikTakim = (S.acikTakim===ad?null:ad); render(); }

/* Bir takımın sayısı hangi maçlardan geliyor */
function takimDetay(ad){
  var satir=[];
  S.matches.forEach(function(m){
    if(m.home!==ad && m.away!==ad) return;
    var evde=(m.home===ad), rakip=evde?m.away:m.home;
    var im=matchImpact(m);
    var etki=evde?im.mid.home:im.mid.away;
    var bosa=evde?im.mid.bosaHome:im.mid.bosaAway;
    var fazla=evde?im.mid.fazlaHome:im.mid.fazlaAway;
    var kararlar=(m.decisions||[]).map(function(d){
      var lehte = (d.harmed==="home")===evde;
      return {metin:typeOf(d.type).label+' · '+d.minute+"′ · %"+d.certainty, lehte:lehte};
    });
    satir.push({rakip:rakip, evde:evde, skor:(evde?m.hg+'-'+m.ag:m.ag+'-'+m.hg),
      hafta:m.week, hakem:m.ref, etki:etki, bosa:bosa, fazla:fazla, kararlar:kararlar});
  });
  if(!satir.length) return '<div class="detay"><p class="note" style="margin:0">Bu takımın kayıtlı maçı yok.</p></div>';
  var h='<div class="detay">';
  satir.forEach(function(x){
    var etkili = Math.abs(x.etki)>0.005 || x.bosa>0.05 || x.fazla>0.05;
    h+='<div class="dsatir"><div class="dust">'
     +'<span>'+(x.evde?'':'@ ')+esc(x.rakip)+' <b class="dskor">'+x.skor+'</b></span>'
     +'<span class="'+(x.etki>=0?'dup':'ddown')+'">'+(etkili?(x.etki>=0?'+':'')+x.etki.toFixed(2):'—')+'</span></div>'
     +'<div class="dmeta">'+(x.hafta?esc(x.hafta)+'. hafta · ':'')+esc(x.hakem||'hakem girilmedi')
     +(x.bosa>0.05?' · <span style="color:var(--amber)" title="Kazanırken uğradığı, tabloya yansımayan hata">sonuca yansımadı +'+x.bosa.toFixed(2)+'</span>':'')
     +(x.fazla>0.05?' · <span style="color:var(--red)" title="Kaybederken yararlandığı, tabloya yansımayan hata">sonuca yansımadı −'+x.fazla.toFixed(2)+'</span>':'')
     +'</div>';
    x.kararlar.forEach(function(k){
      h+='<div class="dkarar"><span class="dnokta" style="background:'+(k.lehte?'var(--greenFill)':'var(--redFill)')+'"></span>'+esc(k.metin)+'</div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}

    +mac+' maç, '+karar+' tartışmalı karar\n\n'+satir
    +'\n\nParantez içi: kararların puan etkisi. ▲▼ gerçek sıralamaya göre değişim.';
  var bitir=function(ok){ S.msg = ok?'Özet panoya kopyalandı.':'Kopyalanamadı. Metni elle seçip kopyalayabilirsin.'; render(); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(metin).then(function(){bitir(true);},function(){bitir(false);});
      return;
    }
  }catch(e){}
  bitir(false);
}

function vTable(){
  if(!S.matches.length) return '<div class="card"><div class="empty">Henüz maç yok.<br>“Maç ekle” sekmesinden haftayı çek ya da tek maç gir.</div></div>';
  var T=buildTable(), maxAbs=1.5;
  T.adj.forEach(function(r){maxAbs=Math.max(maxAbs,Math.abs(r.mid),Math.abs(r.low),Math.abs(r.high));});
  var totalDec=0; S.matches.forEach(function(m){totalDec+=(m.decisions||[]).length;});
  var X=function(v){return 50+(v/maxAbs)*50;};

  var h='<div class="card"><span class="lbl">Düzeltilmiş sıralama</span>';
  h+='<div class="legend"><span><i class="lg"></i>mağduriyet</span><span><i class="lr"></i>haksız kazanç</span></div>';
  h+='<div class="thead"><div class="pos">#</div><div>Takım</div><div class="pts">Puan</div><div class="ctr">Sapma</div><div class="pts">Fark</div></div>';
  T.adj.forEach(function(r){
    var move=r.realPos-r.adjPos;
    var lo=Math.min(r.low,r.high), hi=Math.max(r.low,r.high);
    var bx1=X(lo), bx2=X(hi), w=Math.abs(X(r.mid)-50);
    var acik = S.acikTakim===r.name;
    h+='<div class="trow trow-t'+(acik?' acik':'')+'" data-takim="'+esc(r.name)+'" onclick="takimAc(this.getAttribute(\'data-takim\'))" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();takimAc(this.getAttribute(\'data-takim\'));}" role="button" tabindex="0">'
     +'<div class="pos rank'+(r.adjPos<=3?(' r'+r.adjPos):'')+'">'+r.adjPos+'</div>'+teamCell(r.name)
     +'<div class="pts">'+(r.pts+r.mid).toFixed(1)+'</div>'
     +'<div class="drift" title="'+lo.toFixed(1)+' … '+hi.toFixed(1)+' puan"><div class="axis"></div>'
     +((bx2-bx1)>0.8?'<div class="band" style="left:'+bx1+'%;width:'+(bx2-bx1)+'%"></div>':'')

function vMatches(){
  var h='';
  if(!S.matches.length){ h='<div class="card"><div class="empty">Kayıtlı maç yok.</div></div>'; }
  else{
    var seen={}, dupPairs=[];
    S.matches.forEach(function(m){
      var k=m.home+"|"+m.away;
      if(seen[k]){ if(dupPairs.indexOf(k)<0)dupPairs.push(k); } else seen[k]=1;
    });
    h='<div class="card"><span class="lbl">'+S.matches.length+' maç</span>';
    if(dupPairs.length){
      h+='<div class="warn">Aynı eşleşme birden fazla kayıtlı: '
       +dupPairs.map(function(k){return esc(k.replace("|"," — "));}).join(", ")
       +'. Bu, puan tablosunu bozar — fazlasını sil.</div>';
    }
    /* onaylanmış maçlar bir daha uyarı olarak çıkmaz — averajı bozmuyor, sadece nadir bir skor */
    var odd=S.matches.filter(function(m){return ((m.hg+m.ag)>=7 || m.hg>=6 || m.ag>=6) && !m.skorOnay;});
    if(odd.length){
      h+='<div class="warn"><b>Şüpheli skor</b><br>'
       +odd.map(function(m){
           return esc(m.home)+' '+m.hg+'-'+m.ag+' '+esc(m.away)+(m.week?' ('+esc(m.week)+'. hafta)':'')
             +(MISAFIR?'':' <button class="btn danger" style="padding:3px 9px;font-size:12px;margin-left:6px" onclick="delMatch('+m.id+')">Sil</button>'
                       +' <button class="btn ghost" style="padding:3px 9px;font-size:12px;margin-left:4px" onclick="skorOnayla('+m.id+')">Doğru, uyarma</button>');
         }).join('<br>')
       +'<br><span style="font-weight:400">Süper Lig\'de bu skorlar çok nadirdir. Yanlış girildiyse sil, doğruysa "Doğru, uyarma" ile bir daha çıkmasın.</span></div>';
    }
    /* Haftalara ayır: en yeni hafta üstte, hafta numarası olmayanlar sona */
    var haftalar={}, sirasiz=[];
    S.matches.forEach(function(m){
      var w=String(m.week||"").trim();
      if(!w){ sirasiz.push(m); return; }
      (haftalar[w]=haftalar[w]||[]).push(m);
    });
    var anahtarlar=Object.keys(haftalar).sort(function(a,b){
      var x=parseInt(a,10), y=parseInt(b,10);
      if(isFinite(x)&&isFinite(y)) return y-x;
      return String(b).localeCompare(String(a),"tr");
    });
    if(sirasiz.length) { haftalar["__yok"]=sirasiz; anahtarlar.push("__yok"); }

    anahtarlar.forEach(function(w){
      var grup=haftalar[w];
      /* Hiçbiri seçilmemişse en yeni hafta açık gelsin */
      var acik = S.acikHafta ? (S.acikHafta===w) : (w===anahtarlar[0]);
      var kararSay=0, etki=0;
      grup.forEach(function(m){
        kararSay+=(m.decisions||[]).length;
        var im=matchImpact(m);
        etki+=Math.abs(im.mid.home)+Math.abs(im.mid.away);
      });
      h+='<div class="hafta">'
       +'<div class="hafta-bas" data-w="'+esc(w)+'" onclick="haftaAc(this.getAttribute(\'data-w\'))" role="button" tabindex="0">'
       +'<span class="hafta-ok'+(acik?' acik':'')+'">▾</span>'
       +'<span class="hafta-ad">'+(w==="__yok"?"Haftası girilmemiş":esc(w)+". hafta")+'</span>'
       +'<span class="hafta-sayi">'+grup.length+' maç'
       +(kararSay?' · '+kararSay+' karar':'')
       +(etki>0.05?' · <b>'+etki.toFixed(1)+' puan</b>':'')
       +'</span></div>';
      if(!acik){ h+='</div>'; return; }
      h+='<div class="hafta-ic">';
      grup.slice().reverse().forEach(function(m){
      var im=matchImpact(m), n=(m.decisions||[]).length;
      h+='<div class="match'+(n?' has':'')+'"><div class="mtop"><span class="mteams">'+esc(m.home)+' — '+esc(m.away)+'</span>'
       +'<span class="mscore">'+m.hg+':'+m.ag+'</span></div><div class="mmeta">'
       +esc(m.ref||"hakem girilmedi")
       +(n?(' · etki '+(im.mid.home>=0?'+':'')+im.mid.home.toFixed(2)+' / '+(im.mid.away>=0?'+':'')+im.mid.away.toFixed(2)):'')
       +(m.by?'<span class="by">'+esc(m.by)+'</span>':'')
       +'</div>';
      (m.decisions||[]).forEach(function(x){
        h+='<div class="dec">'+esc(typeOf(x.type).label)+' · mağdur: '+esc(x.harmed==="home"?m.home:m.away)+' · '+x.minute+'′'
         +'<span class="chip">%'+x.certainty+'</span>'
         +(x.by&&x.by!==m.by?'<span class="by">'+esc(x.by)+'</span>':'')
         +(x.note?'<div style="color:var(--dim)">'+esc(x.note)+'</div>':'')+'</div>';
      });
      if(S.quick&&S.quick.id===m.id&&!MISAFIR){ h+=quickPanel(m); }
      else if(!MISAFIR){
        h+='<div class="btnrow" style="margin-top:9px">'
         +'<button class="btn" style="padding:8px 14px;font-size:13.5px" onclick="quickStart('+m.id+')">+ Karar ekle</button>'
         +'<button class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="editMatch('+m.id+')">Düzenle</button>'
         +'<button class="btn danger" style="padding:8px 12px;font-size:13px" onclick="delMatch('+m.id+')">Sil</button></div>';
      }
      h+='</div>';
      });               /* maç döngüsü */
      h+='</div></div>';  /* hafta-ic + hafta */
    });                 /* hafta döngüsü */
    h+='</div>';        /* kart */
  }
  return h;
}

/* Hafta klasörünü aç-kapa */
function haftaAc(w){ S.acikHafta = (S.acikHafta===w ? null : w); render(); }

/* Karar bazında etki dökümü: hangi hakem, hangi takım lehine/aleyhine skoru kaç puan etkiledi.
   kararEtkisi() kararı çıkarıp maçı yeniden hesaplar; 0'a yakın çıkanlar skoru değiştirmemiştir. */
function etkiDokumu(){
  var takim={}, hakem={}, toplamKarar=0, etkiliKarar=0;
  function tEnt(t){ if(!takim[t]) takim[t]={ad:t,kazanc:0,kayip:0,lehKarar:0,aleyhKarar:0,etkiliLeh:0,etkiliAleyh:0}; return takim[t]; }
  /* agirlik: kesinlikle ağırlıklandırılmış hata hacmi (sonucu ne olursa olsun)
     lehteSayi: kararların yönü, sayı bazlı — sonuçsuz hatalar da taraflılığa sayılır */
  function hEnt(h){ if(!hakem[h]) hakem[h]={ad:h,mac:0,karar:0,etkili:0,puan:0,agirlik:0,yansimayan:0,lehte:{},lehteSayi:{}}; return hakem[h]; }

  S.matches.forEach(function(m){
    var hk=(m.ref||"").trim()||"(hakem girilmedi)";
    var H=hEnt(hk); H.mac++;
    /* Kırpma yüzünden tabloya yazılamayan etki de hakemin siciline işler */
    var im0=matchImpact(m);
    H.yansimayan += (im0.mid.bosaHome||0)+(im0.mid.bosaAway||0)+(im0.mid.fazlaHome||0)+(im0.mid.fazlaAway||0);
    (m.decisions||[]).forEach(function(d,i){
      toplamKarar++; H.karar++;
      /* Hata hacmi: %100 kesin hata 1,0 sayılır, %60 tartışmalı olan 0,6.
         Sonuca etkisi olmasa bile hakemin siciline yazılır. */
      H.agirlik += Math.max(0,Math.min(100, d.certainty||0))/100;
      var e=kararEtkisi(m,i);
      var magdur=(d.harmed==="home")?m.home:m.away;
      var rakip=(d.harmed==="home")?m.away:m.home;
      var kazanan=(d.harmed==="home")?e.home:e.away;   /* mağdurun geri alacağı puan */
      var kaybeden=(d.harmed==="home")?e.away:e.home;  /* rakibin kaybedeceği puan */
      var buyuk=Math.abs(e.home)+Math.abs(e.away);

      tEnt(magdur).aleyhKarar++; tEnt(rakip).lehKarar++;
      H.lehteSayi[rakip]=(H.lehteSayi[rakip]||0)+1;
      if(buyuk>0.05){
        etkiliKarar++; H.etkili++; H.puan+=buyuk;
        tEnt(magdur).etkiliAleyh++; tEnt(rakip).etkiliLeh++;
        /* mağdurun kaybettiği = düzeltilince kazanacağı; rakibin haksız kazancı = düşecek puanı */
        tEnt(magdur).kayip += Math.max(0,kazanan);
        tEnt(rakip).kazanc += Math.max(0,-kaybeden);
        H.lehte[rakip]=(H.lehte[rakip]||0)+buyuk;
      }
    });
  });
  var tl=Object.keys(takim).map(function(k){return takim[k];})
    .filter(function(t){return t.kazanc>0.05||t.kayip>0.05||t.etkiliLeh||t.etkiliAleyh;})
    .sort(function(a,b){return (b.kazanc+b.kayip)-(a.kazanc+a.kayip);});
  var hl=Object.keys(hakem).map(function(k){return hakem[k];})
    .filter(function(h){return h.mac>0;})
    .map(function(h){
      h.macBasi = h.puan/h.mac;            /* maç başına puan etkisi */
      h.macBasiHata = h.agirlik/h.mac;     /* maç başına ağırlıklı hata */
      /* Taraflılık artık karar SAYISINA göre — sonuçsuz hatalar da sayılıyor */
      var v=Object.keys(h.lehteSayi).map(function(t){return h.lehteSayi[t];});
      var top=v.reduce(function(a,b){return a+b;},0);
      h.dengesizlik = top>0 ? Math.max.apply(null,v)/top : 0;
      h.enCokLehte = top>0 ? Object.keys(h.lehteSayi).sort(function(a,b){return h.lehteSayi[b]-h.lehteSayi[a];})[0] : null;
      return h;
    })
    .sort(function(a,b){
      return S.hakemSira==="etki" ? (b.macBasi-a.macBasi) : (b.macBasiHata-a.macBasiHata);
    });
  return {takimlar:tl, hakemler:hl, toplamKarar:toplamKarar, etkiliKarar:etkiliKarar};
}

function vEtkiOzet(){
  var d=etkiDokumu();
  if(!d.toplamKarar) return '';
  var h='<div class="card"><span class="lbl">Skora etki eden kararlar</span>'
   +'<p class="note" style="margin-top:0">Girilen <b>'+d.toplamKarar+'</b> kararın <b>'+d.etkiliKarar+'</b> tanesi puan tablosunu değiştirdi. '
   +'Kalanı kayda geçti ama sonucu etkilemedi — farkı kapatamayacak kadar geç ya da küçüktü.</p>';

  if(d.hakemler.length){
    var ASGARI=3;
    var etkiSira = S.hakemSira==="etki";
    var yeter=d.hakemler.filter(function(r){return r.mac>=ASGARI;});
    var az=d.hakemler.filter(function(r){return r.mac<ASGARI;});

    function satir(r,i){
      var pay=r.dengesizlik, enCok=r.enCokLehte;
      /* Sıralama ölçüsü vurgulu, diğeri soluk — hangi listeye baktığın belli olsun */
      return '<div class="ozet-sat">'
       +'<span class="ozet-no">'+(i+1)+'</span>'
       +'<span class="ozet-ad">'+esc(r.ad)
       +'<span class="ozet-alt">'+r.mac+' maç · '+r.karar+' karar'
       +(r.etkili?' ('+r.etkili+"'i skoru değiştirdi)":' (hiçbiri skoru değiştirmedi)')
       +(r.yansimayan>0.05?' · <span style="color:var(--amber)">'+r.yansimayan.toFixed(1)+' sonuca yansımadı</span>':'')
       +(enCok&&pay>0.7&&r.karar>=3?'<br><span style="color:var(--red)">kararlarının %'+Math.round(pay*100)+"'i tek takım lehine: "+esc(enCok)+'</span>'
         :(enCok?' · en çok <b>'+esc(enCok)+'</b> lehine':''))
       +'</span></span>'
       +'<span class="ozet-ik" style="grid-template-columns:52px 52px">'
       +'<i class="'+(etkiSira?'sol':'ana')+'">'+r.macBasiHata.toFixed(2)+'</i>'
       +'<i class="'+(etkiSira?'ana':'sol')+'">'+r.macBasi.toFixed(2)+'</i>'
       +'</span></div>';
    }

    h+='<div class="ozet-bas">Hakem karnesi</div>'
     +'<div class="siraSec">'
     +'<button class="'+(etkiSira?'':'on')+'" onclick="hakemSirala(\'hata\')">Hata sayısına göre</button>'
     +'<button class="'+(etkiSira?'on':'')+'" onclick="hakemSirala(\'etki\')">Puan etkisine göre</button>'
     +'</div>'

     +(yeter.length?'':'<p class="note">En az '+ASGARI+' maç yöneten hakemler ayrı sıralanır; şu an hiçbiri bu sayıya ulaşmadı.</p>')
     +'<p class="note" style="color:var(--amber)">Listede altta olmak iyi hakemlik demek değildir; o hakemin maçlarında <b>kayda geçmiş hata olmaması</b> demektir. '
     +'Kimse o maçları izleyip karar girmediyse hakem tertemiz görünür. Bu tablo ancak kayıt eksiksizse anlamlıdır.</p>';

     +'<div class="ozet-sat ozet-kafa"><span class="ozet-no"></span><span class="ozet-ad">Takım</span>'
     +'<span class="ozet-ik"><i>kazanç</i><i>kayıp</i></span></div>';

       +'<span class="ozet-no">'+(i+1)+'</span>'
       +'<span class="ozet-ad">'+esc(t.ad)

       +'<span class="ozet-ik">'
       +'<i class="art">'+(t.kazanc>0.05?'+'+t.kazanc.toFixed(1):'—')+'</i>'

}

function vRefs(){
  var map={};
  S.matches.forEach(function(m){
    var name=(m.ref||"").trim(); if(!name)return;
    if(!map[name])map[name]={name:name,games:0,decs:0,byTeam:{}};
    map[name].games++;
    var im=matchImpact(m);
    function ent(t){ if(!map[name].byTeam[t])map[name].byTeam[t]={f:0,a:0,pts:0,bosa:0,fazla:0}; return map[name].byTeam[t]; }
    (m.decisions||[]).forEach(function(x){
      map[name].decs++;
      ent(x.harmed==="home"?m.home:m.away).a++;
      ent(x.harmed==="home"?m.away:m.home).f++;
    });
    ent(m.home).pts+=im.mid.home; ent(m.away).pts+=im.mid.away;
    ent(m.home).bosa+=im.mid.bosaHome; ent(m.away).bosa+=im.mid.bosaAway;
    ent(m.home).fazla+=im.mid.fazlaHome; ent(m.away).fazla+=im.mid.fazlaAway;
  });
  /* Hakemleri karar sayısına göre değil, skorlara ettikleri toplam etkiye göre sırala */
  Object.keys(map).forEach(function(k){
    var r=map[k], t=0;
    Object.keys(r.byTeam).forEach(function(tk){ t+=Math.abs(r.byTeam[tk].pts); });
    r.agirlik=t/2;   /* her maçta iki taraf sayıldığı için ikiye böl */
  });
  var refs=Object.keys(map).map(function(k){return map[k];})
    .sort(function(a,b){ return (b.agirlik-a.agirlik) || (b.decs-a.decs); });
  if(!refs.length) return vEtkiOzet()+vEtkili()+'<div class="card"><div class="empty">Hakem adı girilmiş maç yok.<br>Maç eklerken hakem alanını doldurursan burada döküm çıkar.</div></div>';
  var h=vEtkiOzet()+vEtkili();
  refs.forEach(function(r){
    h+='<div class="card"><div class="mtop" style="margin-bottom:9px">'
     +'<span style="font-family:\'Oswald\',sans-serif;font-weight:600;font-size:19px;letter-spacing:.02em">'+esc(r.name)+'</span>'
     +'<span class="mscore">'+r.games+' maç · '+r.decs+' karar'
     +(r.agirlik>0.05?' · <b style="color:var(--amber)">'+r.agirlik.toFixed(1)+' puan</b>':'')
     +'</span></div>';
    Object.keys(r.byTeam).filter(function(k){return r.byTeam[k].f||r.byTeam[k].a;})
      .sort(function(a,b){return (r.byTeam[b].a-r.byTeam[b].f)-(r.byTeam[a].a-r.byTeam[a].f);})
      .forEach(function(k){
        var v=r.byTeam[k];
        h+='<div class="trow" style="grid-template-columns:1fr 44px 44px 58px"><div class="team">'+esc(k)+'</div>'
         +'<div class="pts" style="color:var(--green)">'+v.f+'</div>'
         +'<div class="pts" style="color:var(--red)">'+v.a+'</div>'
         +'<div class="delta '+(v.pts>=0?'up':'down')+'">'+(v.pts>=0?'+':'')+v.pts.toFixed(1)
         +(v.bosa>0.05?'<span class="mv" style="color:var(--amber)" title="puana dönüşemeyen mağduriyet">◦'+v.bosa.toFixed(1)+'</span>':'')
         +'</div></div>';
      });
    h+='</div>';
  });
  return h;
}

function quickPanel(m){
  var q=S.quick;
  var h='<div class="qpanel">';
  var chips=[];
  if(q.type) chips.push(typeOf(q.type).label);
  if(q.harmed) chips.push("Mağdur: "+(q.harmed==="home"?m.home:m.away));
  if(q.certainty) chips.push("%"+q.certainty);
  if(chips.length) h+='<div class="qchips">'+chips.map(function(c){return '<span class="qchip">'+esc(c)+'</span>';}).join('')+'</div>';

  if(!q.type){
    h+='<p class="qstep">Ne oldu?</p><div class="qgrid">'
     +TYPES.map(function(t){return '<button class="qbtn" onclick="quickSet(\'type\',\''+t.id+'\')">'+t.label+'</button>';}).join('')
     +'</div>';
  } else if(!q.harmed){
    h+='<p class="qstep">Kim mağdur oldu?</p><div class="qgrid">'
     +'<button class="qbtn" onclick="quickSet(\'harmed\',\'home\')">'+esc(m.home)+'</button>'
     +'<button class="qbtn" onclick="quickSet(\'harmed\',\'away\')">'+esc(m.away)+'</button></div>';
  } else if(!q.certainty){
    h+='<p class="qstep">Ne kadar net bir hata?</p><div class="qgrid">'
     +'<button class="qbtn" onclick="quickSet(\'certainty\',95)">Kesin hata<br><span style="font-size:12px;color:var(--muted)">tartışmasız</span></button>'
     +'<button class="qbtn" onclick="quickSet(\'certainty\',60)">Tartışmalı<br><span style="font-size:12px;color:var(--muted)">yorum farkı</span></button></div>';
  } else if(!q.minute){
    h+='<p class="qstep">Kaçıncı dakikada?</p>'
     +'<div class="qmin">'
     +[10,25,45,60,75,85].map(function(x){
        return '<button class="qbtn" onclick="quickSet(\'minute\','+x+')">'+x+"′</button>";
       }).join('')
     +'</div>'
     +'<div class="qelle">'
     +'<input id="qdk" type="number" inputmode="numeric" min="1" max="120" placeholder="ya da yaz (1-120)">'
     +'<button class="btn" onclick="quickDakika()">Tamam</button>'
     +'</div>'
     +'<input id="qnot" type="text" maxlength="120" placeholder="Not (isteğe bağlı) — ör. VAR incelemedi" style="width:100%;margin-top:9px">';
  }
  h+='<div class="btnrow"><button class="btn ghost" style="padding:8px 14px;font-size:13px" onclick="quickCancel()">Vazgeç</button></div></div>';
  return h;
}
function quickStart(id){
  if(MISAFIR) return; S.quick={id:id,type:"",harmed:"",certainty:0,minute:0}; render(); }
function quickDakika(){
  if(MISAFIR) return;
  var el=document.getElementById("qdk");
  var v=parseInt(el&&el.value,10);
  if(!isFinite(v)||v<1||v>120){ S.msg="Dakika 1 ile 120 arasında olmalı."; render(); return; }
  quickSet("minute", v);
}
function quickCancel(){
  if(MISAFIR) return; S.quick=null; render(); }
function quickSet(k,v){
  if(MISAFIR) return;
  var q=S.quick; q[k]=v;
  if(q.type&&q.harmed&&q.certainty&&q.minute) quickCommit();
  else render();
}
function quickCommit(){
  var q=S.quick;
  var m=S.matches.filter(function(x){return x.id===q.id;})[0];
  if(!m){ S.quick=null; render(); return; }
  if(!m.decisions) m.decisions=[];
  var nt=document.getElementById("qnot");
  m.decisions.push({type:q.type,harmed:q.harmed,minute:q.minute||45,certainty:q.certainty,
                    note:(nt&&nt.value||"").slice(0,120),by:S.me});
  S.quick=null; save(); render();
}

/* ---------------- Eylemler ---------------- */
function setD(k,v){ S.draft[k]=v; render(); }
function setDQ(k,v){ S.draft[k]=v; }
function setGoal(k,el){
  var raw=(el.value||"").replace(/^0+(?=\d)/,"");
  if(raw!==el.value) el.value=raw;
  S.draft[k]= raw==="" ? "" : Math.max(0,Math.min(20,parseInt(raw,10)||0));
  var hg=+S.draft.hg||0, ag=+S.draft.ag||0;
  var w=document.getElementById("goalWarn");
  if(w) w.innerHTML=(hg>6||ag>6)
    ? '<div class="warn" style="margin:0 0 10px">'+hg+'-'+ag+' girdin \u2014 emin misin? Bu skor Süper Lig\'de çok nadirdir.</div>' : "";
}
function addDec(){
  if(MISAFIR) return; S.draft.decs.push({type:"pen_not",harmed:"home",minute:45,certainty:80,note:"",by:S.me}); render(); }
function setDec(i,k,v){
  if(MISAFIR) return; S.draft.decs[i][k]=v; S.draft.decs[i].by=S.me; render(); }
function setDecQ(i,k,v){ S.draft.decs[i][k]=v; S.draft.decs[i].by=S.me; }
function delDec(i){
  if(MISAFIR) return; S.draft.decs.splice(i,1); render(); }
function findDupes(home,away,skipId){
  return S.matches.filter(function(m){
    return m.id!==skipId && m.home===home && m.away===away;
  });
}
function saveMatch(){
  if(MISAFIR) return;
  var d=S.draft;
  if(d.home===d.away){ S.msg="Ev sahibi ve deplasman aynı takım olamaz."; render(); return; }
  if(!S.teams.length||S.teams.indexOf(d.home)<0||S.teams.indexOf(d.away)<0){
    S.msg="Takımlardan biri listede yok. Takımlar sekmesinden ekle."; render(); return; }
  var dup=findDupes(d.home,d.away,S.editId);
  if(dup.length){
    var lst=dup.map(function(m){return "  • "+m.hg+"-"+m.ag+(m.week?" ("+m.week+". hafta)":"")+(m.by?" — "+m.by:"");}).join("\n");
    if(!confirm(d.home+" — "+d.away+" zaten kayıtlı:\n"+lst+"\n\nYine de ikinci kez eklensin mi? Eklenirse tabloda iki maç olarak sayılır."))return;
  }
  var rec={id:S.editId||Date.now(),week:(d.week||"").trim(),home:d.home,away:d.away,
    hg:+d.hg||0,ag:+d.ag||0,ref:(d.ref||"").trim(),decisions:d.decs.slice(),by:S.me};
  if(S.editId){ S.matches=S.matches.map(function(m){return m.id===S.editId?rec:m;}); }
  else{ S.matches.push(rec); }
  S.draft=null; S.editId=null; S.tab="matches"; save(); render();
}
function editMatch(id){
  var m=S.matches.filter(function(x){return x.id===id;})[0]; if(!m)return;
  S.draft={home:m.home,away:m.away,hg:m.hg,ag:m.ag,ref:m.ref,week:m.week,
    decs:(m.decisions||[]).map(function(d){return {type:d.type,harmed:d.harmed,minute:d.minute,certainty:d.certainty,note:d.note||"",by:d.by};})};
  S.editId=id; S.tab="add"; render();
}
function cancelEdit(){ S.draft=null; S.editId=null; S.tab="matches"; render(); }
function hakemSirala(n){ S.hakemSira = (n==="etki"?"etki":"hata"); render(); }
function skorOnayla(id){
  if(MISAFIR) return;
  var m=S.matches.filter(function(x){return x.id===id;})[0];
  if(m){ m.skorOnay=true; save(); render(); }
}
function delMatch(id){
  if(MISAFIR) return;
  var m=S.matches.filter(function(x){return x.id===id;})[0];
  if(!confirm((m&&m.by&&m.by!==S.me?(m.by+" tarafından girilmiş bu maç"):"Bu maç")+" silinsin mi? Değişiklik herkeste geçerli olur."))return;
  S.matches=S.matches.filter(function(x){return x.id!==id;}); save(); render();
}
function exportData(){
  var blob=new Blob([JSON.stringify({teams:S.teams,matches:S.matches},null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="dudukpayi-yedek-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  if(MISAFIR) return;
  var f=inp.files&&inp.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.matches)||!Array.isArray(d.teams)) throw 0;
      if(!confirm("İçe aktarma ortak defterdeki "+S.matches.length+" maçın yerine geçecek ve beşinizi birden etkiler. Devam?")){inp.value="";return;}
      S.teams=d.teams; S.matches=macTemizle(d.matches); save(); render();
    }catch(e){ S.msg="Dosya okunamadı — geçerli bir Düdük Payı yedeği değil."; render(); }
    inp.value="";
  };
  rd.readAsText(f);
}

/* ---- Haftayı toplu çekme ---- */
function norm(s){
  return String(s||"").toLocaleLowerCase("tr")
    .replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g")
    .replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/[^a-z0-9]/g,"");
}
/* İnternetten hafta çekme: TheSportsDB eventsround.php.
   Ücretsiz "123" anahtarı sınırlı ve paylaşımlı; yoğun kullanımda ya da
   kaynak değişirse çalışmayabilir. Başarısız olursa kullanıcı elle arayıp
   yapıştırma kutusunu kendisi doldurmaya devam edebilir — akış bozulmaz. */
function internettenCek(){
  if(MISAFIR||S.cekBusy) return;
  var el=document.getElementById("cekHafta");
  var hafta=parseInt(el&&el.value,10);
  if(!isFinite(hafta)||hafta<1||hafta>34){ S.cekMsg="Hafta numarası 1 ile 34 arasında olmalı."; S.cekHata=true; render(); return; }
  S.cekHaftaNo=String(hafta); S.cekBusy=true; S.cekMsg=""; S.cekHata=false; render();

  var url="https://www.thesportsdb.com/api/v1/json/123/eventsround.php?id=4339&r="+hafta+"&s=2026-2027";
  fetch(url).then(function(r){
    if(!r.ok) throw new Error("sunucu "+r.status+" döndü");
    return r.json();
  }).then(function(data){
    S.cekBusy=false;
    var olaylar=(data&&data.events)||[];
    if(!olaylar.length){ S.cekMsg="Bu haftada veri bulunamadı. Hafta henüz oynanmamış ya da kaynak bu ligi desteklemiyor olabilir."; S.cekHata=true; render(); return; }

    var satirlar=[], eslesmeyen=[], skorsuz=0;
    olaylar.forEach(function(e){
      var hg=e.intHomeScore, ag=e.intAwayScore;
      if(hg===null||hg===undefined||ag===null||ag===undefined||hg===""||ag===""){ skorsuz++; return; }
      var H=nearestTeam(e.strHomeTeam), A=nearestTeam(e.strAwayTeam);
      if(!H||!A){ eslesmeyen.push((H?"":e.strHomeTeam+" ")+(A?"":e.strAwayTeam)); return; }
      satirlar.push({home:H,away:A,hg:parseInt(hg,10)||0,ag:parseInt(ag,10)||0,ref:"",week:String(hafta)});
    });

    var kutu=document.getElementById("pasteIn");
    if(kutu) kutu.value = satirlar.length ? JSON.stringify(satirlar,null,1) : "";

    var parts=[];
    if(satirlar.length) parts.push(satirlar.length+" maç bulundu, hakem alanlarını doldurup \"Maçları ekle\"ye basmadan önce gözden geçir");
    if(skorsuz) parts.push(skorsuz+" maç henüz oynanmamış");
    if(eslesmeyen.length) parts.push("tanınmayan takım: "+eslesmeyen.join(", "));
    S.cekMsg = parts.length ? parts.join(". ")+"." : "Bu haftadan kullanılabilir maç çıkmadı.";
    S.cekHata = !satirlar.length;
    render();
  }).catch(function(err){
    S.cekBusy=false;
    S.cekMsg="Çekilemedi ("+(err&&err.message||"ağ hatası")+"). Kaynağa bu cihazdan ulaşılamıyor olabilir; her zamanki gibi arayıp elle yapıştırabilirsin.";
    S.cekHata=true;
    render();
  });
}

function nearestTeam(name){
  if(!name) return null;
  var n=norm(name); if(!n) return null;
  for(var i=0;i<S.teams.length;i++){ if(norm(S.teams[i])===n) return S.teams[i]; }
  for(var j=0;j<S.teams.length;j++){
    var u=norm(S.teams[j]);
    if(u.indexOf(n)>=0||n.indexOf(u)>=0) return S.teams[j];
  }
  return null;
}
function isDup(home,away,week){
  return S.matches.some(function(m){
    return m.home===home && m.away===away && (!week || String(m.week)===String(week));
  });
}
function pasteWeek(){
  if(MISAFIR) return;
  var el=document.getElementById("pasteIn"); var raw=(el.value||"").trim();
  if(!raw){ S.msg="Önce veriyi yapıştır."; render(); return; }
  var arr;
  try{
    var a=raw.indexOf("["), z=raw.lastIndexOf("]");
    arr=JSON.parse(a>=0?raw.slice(a,z+1):raw);
    if(!Array.isArray(arr)) arr=[arr];
  }catch(e){ S.msg="Yapıştırdığın metin okunamadı. Köşeli parantezle başlayıp biten liste olmalı."; render(); return; }
  var eklendi=0, mukerrer=0, sorunlu=[];
  arr.forEach(function(x,i){
    var H=nearestTeam(x.home), A=nearestTeam(x.away);
    if(!H||!A){ sorunlu.push((!H?x.home:x.away)); return; }
    if(H===A){ sorunlu.push(String(x.home)+' — iki taraf aynı takım'); return; }
    var wk=String(x.week||"").trim();
    if(isDup(H,A,wk)){ mukerrer++; return; }
    S.matches.push({id:Date.now()+i,week:wk,home:H,away:A,
      hg:Number(x.hg)||0,ag:Number(x.ag)||0,ref:(x.ref||"").trim(),decisions:[],by:S.me});
    eklendi++;
  });
  el.value="";
  var parts=[];
  if(eklendi) parts.push(eklendi+" maç eklendi");
  if(mukerrer) parts.push(mukerrer+" tanesi zaten kayıtlıydı");
  if(sorunlu.length) parts.push("tanınmayan takım: "+sorunlu.join(", "));
  S.msg = parts.length ? parts.join(", ")+"." : "Eklenecek maç bulunamadı.";
  if(eklendi){ save(); S.tab="matches"; }
  render();
}

   +'<div class="lockup"><svg class="mark" width="52" height="52" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0B1210"/><rect x="2.5" y="2.5" width="27" height="27" rx="6.5" stroke="#126B45" stroke-width="1" opacity=".55"/><line x1="16" y1="3" x2="16" y2="29" stroke="#126B45" stroke-width=".7" opacity=".45"/><circle cx="16" cy="16" r="4.2" stroke="#126B45" stroke-width=".7" opacity=".45"/><rect x="4.5" y="13.2" width="14.5" height="5.6" rx="1.8" fill="#E8B62C"/><circle cx="20.2" cy="16" r="5.4" fill="#E8B62C"/><rect x="6" y="14.6" width="2.1" height="2.8" rx=".5" fill="#0B1210"/><circle cx="20.6" cy="16" r="1.85" fill="#0B1210"/></svg><div><h1>Düdük <span>Payı.</span></h1>'
   +'<p class="season">2026–27 · Süper Lig</p></div></div>'
   +'<p class="sub">Hakem kararları düzeltilseydi puan tablosu ne olurdu?</p>'
   +'<div class="kpis"><div class="kpi"><b>'+S.matches.length+'</b><span>maç</span></div>'
   +'<div class="kpi"><b>'+karar+'</b><span>karar</span></div>'
   +'<div class="kpi"><b>'+S.teams.length+'</b><span>takım</span></div></div>'
   +'<div class="who">'
   +(MISAFIR
      ? '<span class="misafir">Misafir görünümü</span>'
        +'<button class="temabtn" onclick="temaDegis()">'+temaEtiket()+'</button>'
      : '<span>Defteri tutan: <b>'+esc(S.me)+'</b></span>'
        +'<button onclick="switchMe()">değiştir</button>'
        +'<button class="temabtn" onclick="temaDegis()">'+temaEtiket()+'</button>'
        +'<span class="by">'+(S.sync==="ortak"?'● ortak defter':S.sync==="hata"?'● bağlantı hatası':S.sync==="…"?'●':'● yalnız bu cihaz')+'</span>')
   +'</div></header>'
   +(S.msg?'<div class="'+(/eklendi|kayıtlıydı|Bağlandı|yüklendi|kopyalandı/.test(S.msg)?'ok':'warn')+'">'+esc(S.msg)+'</div>':'')
   +'<div class="tabwrap" id="tabwrap"><span class="tabok l">‹</span><span class="tabok r">›</span>'
   +'<nav class="tabs" id="tabs" onscroll="tabGolge()">'+TABS.map(function(t){
      return '<button class="tab'+(S.tab===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';
    }).join('')+'</nav></div><main>'+body+'</main>'
   +'<footer class="foot"><b>Düdük Payı</b> · MIT. Tek HTML dosyası.<br>Kulüp armaları yok. Skorlar TFF; tartışmalı karar senin kaydın.</footer></div>';
  tabGolge(); tabOrtala();
}
function tabGolge(){
  var n=document.getElementById("tabs"), w=document.getElementById("tabwrap");
  if(!n||!w) return;
  var kacak=n.scrollWidth-n.clientWidth;
  if(kacak<6){ w.className="tabwrap"; return; }
  var c="tabwrap";
  if(n.scrollLeft>4) c+=" sol";
  if(n.scrollLeft<kacak-4) c+=" sag";
  w.className=c;
}
/* Seçili sekme görünür değilse ortala */
function tabOrtala(){
  var n=document.getElementById("tabs"); if(!n) return;
  var a=n.querySelector(".tab.on"); if(!a) return;
  var sol=a.offsetLeft, sag=sol+a.offsetWidth;
  if(sol<n.scrollLeft || sag>n.scrollLeft+n.clientWidth)
    n.scrollLeft=sol-(n.clientWidth-a.offsetWidth)/2;
  tabGolge();
}
/* ---- Tema ----
   S.tema: "acik" | "koyu" | null (null = sistem ayarına uy) */
function temaOku(){ return lsGet("dp-tema")||null; }
function temaUygula(){
  /* Açılış yolunda çalışır; burada bir hata tüm uygulamayı düşürür. */
  try{
    var t=S.tema;
    var h=document.documentElement;
    if(h){ if(t) h.setAttribute("data-tema",t); else h.removeAttribute("data-tema"); }
    var koyu = t==="koyu" ||
      (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
    var mt=document.querySelector?document.querySelector('meta[name="theme-color"]'):null;
    if(mt) mt.setAttribute("content", koyu?"#0B1210":"#EFF2EC");
  }catch(e){}
}
function temaDegis(){
  /* sıra: sistem -> açık -> koyu -> sistem */
  S.tema = S.tema===null ? "acik" : S.tema==="acik" ? "koyu" : null;
  if(S.tema) lsSet("dp-tema",S.tema); else lsDel("dp-tema");
  temaUygula(); render();
}
function temaEtiket(){
  return S.tema===null ? "Tema: sistem" : S.tema==="acik" ? "Tema: açık" : "Tema: koyu";
}

function switchMe(){ S.me=null; render(); }
function go(t){
  if(MISAFIR && ["add","teams"].indexOf(t)>=0) return;
  S.tab=t; S.msg=""; render();
}
boot();
